# ═══════════════════════════════════════════════════════════════════
# NetShield IDS — Nginx Reverse Proxy Configuration
# ═══════════════════════════════════════════════════════════════════
#
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/network-ids
#          sudo ln -s /etc/nginx/sites-available/network-ids /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream ids_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    # ── Logs ─────────────────────────────────────────────────────
    access_log /var/log/nginx/network-ids.access.log;
    error_log  /var/log/nginx/network-ids.error.log;

    # ── Security Headers ─────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' ws: wss:;" always;

    # ── WebSocket upgrade ────────────────────────────────────────
    location /ws/ {
        proxy_pass http://ids_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://ids_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static assets (cached) ───────────────────────────────────
    location /assets/ {
        proxy_pass http://ids_backend;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Root ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://ids_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
